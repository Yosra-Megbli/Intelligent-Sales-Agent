services:
  - type: web
    name: ecofix-sophie-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: API_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # RAG v2 (docs/RAG_BACKLOG.md) - optional, only needed to run
      # rag_v2/ingest.py against a real embedding API. The deployed web
      # service itself doesn't call this today (no admin API/retrieval
      # wired up yet - Phase 1 only).
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: RAG_TOP_K
        sync: false
      - key: RAG_MIN_SIMILARITY
        sync: false
