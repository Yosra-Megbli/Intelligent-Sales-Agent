[pytest]
# Collection roots are pinned so a bare `pytest` behaves identically on a dev
# machine and on a CI runner. Without this, collection depends on the
# invocation and reaches backend/scripts/, whose prod_compliance_test.py
# matches the default `*_test.py` pattern but is an operational script that
# sys.exit()s at import when its env vars are absent - aborting the whole
# session with INTERNALERROR rather than failing one test.
testpaths = tests golden_tests
